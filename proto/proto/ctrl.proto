syntax = "proto3";
package mtdss.ctrl;
message DirEntry {
  string name = 1;      // 显示名(无路径;根卷条目 Windows="C:"、Unix="/")
  string path = 2;      // 供后续 list/stat 的绝对路径(Windows 根="C:\\")
  uint64 size = 3;      // 目录=0
  uint64 mtime_ms = 4;  // Unix 毫秒;不可得=0
  bool is_dir = 5;
}
message ListRequest  { string path = 1; }                 // "" = 根卷列表
message StatRequest  { string path = 1; }
message ListResponse { repeated DirEntry entries = 1; bool truncated = 2; }
message StatResponse { DirEntry entry = 1; }
message PathOpFailure { string path = 1; string code = 2; string message = 3; }
message DeleteRequest { repeated string paths = 1; bool force_permanent = 2; }
message DeleteResponse { uint32 deleted = 1; bool recycled = 2; repeated PathOpFailure failed = 3; }
message MovePair { string from = 1; string to = 2; }
// M4a-3 增量:Copy/Move 请求带冲突策略(3/2 = 各自下一可用字段号),
// 响应回带 skipped 跳过表(3)。CTRL_VERSION 不升:旧端把未知字段解成
// 缺省(policy=None/空、skipped=空)= legacy 行为,双端互通不破。
message MoveRequest  { repeated MovePair pairs = 1; TransferPolicy policy = 2; }
message MoveResponse { uint32 moved = 1; repeated PathOpFailure failed = 2; repeated string skipped = 3; }
message CopyRequest  { repeated string paths = 1; string dir = 2; TransferPolicy policy = 3; }   // 同设备远端复制(无网络传输)
message CopyResponse { uint32 copied = 1; repeated PathOpFailure failed = 2; repeated string skipped = 3; }
message CtrlError { string code = 1; string message = 2; } // NOT_FOUND|PERMISSION_DENIED|INVALID_PATH|UNSUPPORTED_VERSION|RECYCLE_UNAVAILABLE|INTERNAL
// Task 7 增量:跨设备编排(download 发起)/作业取消与查询。编号 10/11/12
// (req/resp 两侧同占;4/5/8 与 6/7/9 已被 delete/move/copy 占用)。
// TransferPolicy 为 ctrl.proto 自有消息(与 e2e/信令层同名异构,字段同形)。
message TransferPolicy { repeated string skip = 1; repeated string overwrite = 2; }
message OrchestrateRequest  { string job_id = 1; string to_device = 2; repeated string paths = 3;
                              string target_dir = 4; TransferPolicy policy = 5; }
message OrchestrateResponse { bool accepted = 1; string detail = 2; }
message CancelJobRequest  { string job_id = 1; }
message CancelJobResponse { bool cancelled = 1; }
message JobQueryRequest   { string job_id = 1; }
message JobQueryResponse  { string state = 1; uint64 files_done = 2; uint64 files_total = 3;
                            uint64 bytes_done = 4; uint64 bytes_total = 5; string error = 6; }
message CtrlRequest  { uint32 version = 1; oneof body { ListRequest list = 2; StatRequest stat = 3; DeleteRequest delete = 4; MoveRequest move = 5; CopyRequest copy = 8; OrchestrateRequest orchestrate = 10; CancelJobRequest cancel_job = 11; JobQueryRequest job_query = 12; } }
message CtrlResponse { uint32 version = 1; bool ok = 2; oneof body { ListResponse list = 3; StatResponse stat = 4; DeleteResponse delete = 6; MoveResponse move = 7; CopyResponse copy = 9; CtrlError error = 5; OrchestrateResponse orchestrate = 10; CancelJobResponse cancel_job = 11; JobQueryResponse job_query = 12; } }
