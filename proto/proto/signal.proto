syntax = "proto3";
package mtdss.ws;

// 设备 -> 服务器（WebSocket 二进制帧）
message WsClientFrame {
  oneof frame {
    Hello hello = 1;                  // 必须是连接后第一帧
    Relay relay = 2;                  // 请转发给 to_device
    RelayAllocate relay_allocate = 3; // 请求中继分配给 to_device（v2 中继数据面，T4 处理）
    RelayRelease relay_release = 4;   // 显式释放中继会话（v3p6：打洞胜出后回收投机预分配）
  }
}

// 服务器 -> 设备
message WsServerFrame {
  oneof frame {
    HelloOk hello_ok = 1;
    Error error = 2;        // 错误码：1=认证失败 2=目标不在线 3=负载非法
    Relayed relayed = 3;    // 来自 from_device 的转发
    Presence presence = 4;  // 同账号设备上下线
    RelayAllocated relay_allocated = 5; // 中继分配结果（发给会话双方设备）
    RelaySession relay_session = 6;     // 中继会话状态帧（保活/对端存活通告）
    AuthNotice notice = 7;              // 登录/设备变更推送帧（V3-1 增量，服务器尽力推）
  }
}

message Hello { string device_id = 1; string jwt = 2; }
// HelloOk v2 追加中继资格三字段（3-5）：均可缺省，老客户端解码忽略未知字段不受影响
message HelloOk {
  string account_id = 1;
  repeated string stun_addrs = 2;
  bool relay_enabled = 3;                  // 中继是否对该账号启用
  uint32 relay_rate_kbps = 4;              // 中继限速（kbps）
  uint64 relay_quota_remaining_bytes = 5;  // 当期剩余配额（字节）；u64::MAX=不限
}
message Error { uint32 code = 1; string message = 2; }
message Relay { string to_device = 1; bytes payload = 2; }
message Relayed { string from_device = 1; bytes payload = 2; }
message Presence { string device_id = 1; bool online = 2; }

// 中继分配请求（设备 -> 服务器）：申请与 to_device 之间的中继通道
// purpose：兜底平面判别（ctrl|transport，v2-P2 票①）——同对端可并发跑
// 两条中继兜底，服务器双帧原样回显，响应方凭它各取各面；老客户端缺省
// 空串，端上对空不过滤（不劣化）
message RelayAllocate { string to_device = 1; string purpose = 2; }

// 中继显式释放请求（设备 -> 服务器，v3p6 Task 7）：打洞抢先成功后对投机
// 预分配的中继会话即弃释放，服务器即刻摘会话并按账号广播 alive:false
//（reason="released"），不再悬等 120s 空闲回收（8 槽/账号下滞留即占额度）。
// 同账号校验不过 / sid 未知（已被空闲回收、重复释放）一律静默忽略（非错误，
// 无应答帧）。混合版本行为（仓内部署顺序客户端先行，旧服务+新客户端窗口
// 真实存在）：旧客户端不发本帧；旧服务器不识本臂 → 走未知帧兜底回
// err(3)「expected relay」，会话照旧滞留至 120s 空闲回收（只损失释放
// 及时性，无正确性损失）——新客户端在 core 侧把窗内 err(3) 归因释放、
// 容忍不断连（释放归因抑制窗），信令不拆；新服务端照单消化、从不应答。
message RelayRelease { uint64 sid = 1; }

// 中继分配结果（服务器 -> 设备）：双方各收一份，凭 tag 到 relay_addr 握手
message RelayAllocated {
  uint64 sid = 1;         // 中继会话号
  bytes tag = 2;          // 握手鉴权令牌（对端凭 tag 关联同会话）
  string relay_addr = 3;  // 中继数据面地址（ip:port）
  int64 expires_at = 4;   // 会话过期时间（Unix 秒）
  uint32 rate_kbps = 5;   // 本会话限速（kbps）
  string peer_device = 6; // 对端设备号：本帧填 to_device（客户端据以关联对端）
  string reason = 7;      // 死因：quota|disabled|idle|released；仅死帧携带，本帧恒空
  string purpose = 8;     // 分配平面（请求 purpose 的回显；老请求为空）
}

// 中继会话状态帧（服务器 -> 设备）：会话保活与对端存活通告
message RelaySession {
  uint64 sid = 1;         // 中继会话号
  bool alive = 2;         // 会话是否存活（false=对端断开/已过期/被显式释放）
  bytes tag = 3;          // 握手鉴权令牌
  string relay_addr = 4;  // 中继数据面地址（ip:port）
  int64 expires_at = 5;   // 会话过期时间（Unix 秒）
  string peer_device = 6; // 对端设备号：分配帧填请求方；死帧留空（按 sid 路由）
  string reason = 7;      // 死因：quota|disabled|idle|released；仅 alive:false 帧携带，其余留空
  string purpose = 8;     // 分配平面（分配帧回显请求 purpose；死帧留空）
}

// V3-1 增量（只增不改号）：登录/设备事件推送帧（服务器 -> 设备，try_send
// 尽力推）。增量兼容：旧端把未知 oneof 变体解成 frame=None，忽略即可，
// 互通不破。kind：join_request|devices_changed|device_evicted|data_changed；
// candidate_name/candidate_platform/code/expires_at 仅 join_request 携带
// （审批码与申请端自报），data_key 仅 data_changed 携带（KV 变更键）。
message AuthNotice {
  string kind = 1;               // 事件类别
  string session_id = 2;         // 审批会话号（join_request 关联 approvals 行）
  string code = 3;               // 审批码（join_request 携带）
  string candidate_name = 4;     // 申请端自报终端名
  string candidate_platform = 5; // 申请端平台（windows|macos|linux|android|ios）
  int64 expires_at = 6;          // 审批码过期时间（Unix 秒）
  string data_key = 7;           // KV 变更键（仅 data_changed 携带）
}
