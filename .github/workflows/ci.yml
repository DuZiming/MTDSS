name: ci
on:
  push:
    branches: [main]
  pull_request:
  # 手动触发(分支任意 ref):worktree 分支验证、job 单独重跑免空推。
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # protoc is required by the proto crate's build script; arduino/setup-protoc
      # installs it and exports PROTOC for all subsequent steps. The repo
      # intentionally ships no .cargo/config.toml PROTOC default: a committed
      # machine-specific absolute path would break fresh clones.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # netns NAT 矩阵(Linux 专属,需 root);矩阵 14 例(6 纯锥 ×1 +
  # 4 含对称 ×2,Task 9)+ auto-spawn 门禁 1 例(M3a Task 8)+ 中继兜底
  # 1 例(v2-P1c Task 8)+ ctrl 中继远端浏览 1 例(v2-P1c 第二刀)+
  # chaos 4 例(Task 10)。
  nat-matrix:
    runs-on: ubuntu-latest
    # 整体兜底:单例有界(矩阵 fail-case 70s),setup/teardown 挂死别烧光 runner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }

      - uses: Swatinem/rust-cache@v2

      # mtdss-daemon 产出 mtdssd 二进制:矩阵两侧各驱动常驻 daemon,
      # 并覆盖 CLI connect_or_spawn 自动拉起门禁用例。
      - run: cargo build --release -p mtdss-cli -p mtdss-daemon -p signaling -p stun-server
      - run: sudo -E env "PATH=$PATH" bash scripts/nat-matrix/matrix.sh

  # Tauri UI 壳冒烟:前端测试 + 构建(vitest/vite/tsc)+ src-tauri cargo check。
  # ui/ 不在根 workspace(根 Cargo.toml 已 exclude),rust-cache 覆盖 ui/src-tauri
  # 与根 workspace 两个工作区(下方 cargo build 三件套的编译缓存)。
  # 依赖前端产物 ../dist:先 npm run build 再 cargo check,顺序不可颠倒。
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # 根 workspace 的 mtdss-daemon 依赖 mtdss-proto(build script 需 protoc;
      # 沿 test job 同款安装面。src-tauri 自身 cargo check 不依赖 proto)
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ui/src-tauri
            .

      # package-lock 的 resolved 均指向 npmmirror(国内开发机产物);CI runner
      # 在海外,把 host 改写回官方源保证稳定拉取。版本与完整性仍按 lock 内
      # 条目解析并 sha512 校验,lock 文件本身不改写。
      - run: npm ci
        working-directory: ui
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_replace_registry_host: always

      # vitest 不在 build 里,单测显式跑
      - run: npx vitest run
        working-directory: ui

      - run: npm run build
        working-directory: ui

      # Task 16 起 tauri.conf.json 把根 target/release/{mtdss.exe,mtdssd.exe}
      # 声明为 bundle resources(三件套 resources 源):下方 cargo check 经
      # tauri-build 解析 tauri.conf.json 时要求资源文件已存在,故先构建根
      # workspace 两件 CLI/daemon——顺带在干净机器上钉死 bundle 布局。
      - run: cargo build --release -p mtdss-cli -p mtdss-daemon

      - run: cargo check --manifest-path ui/src-tauri/Cargo.toml

  # Android 客户端(T12,v2-P3 spec §7):aarch64 引擎交叉编译 + Kotlin JVM
  # 单测(含 IPC 契约 golden 比对)+ debug APK 组装(AGP 自动生成 debug
  # keystore 签名;release 签名是用户离线保管面,不进 CI)。模拟器不进
  # CI——fd 传递/SAF/MediaStore/安装器行为由 docs/smoke-p3.md 的 MIX 3 实机
  # 冒烟兜底(评审裁定⑤同源)。
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 终审 Important#1:仓内 wrapper distributionUrl 只指向腾讯镜像(本地中国网络依赖),GitHub runner 到不了腾讯 CDN 时 android job 首步 wrapper 下载即挂;CI 在任何 gradle 调用前覆写为官方源(版本号段原样保留),仓内文件不动。置于 setup-java 之前,使 gradle 缓存键对 wrapper properties 的哈希全程一致。
      - name: Gradle 发行源切官方(CI 直连;本地保留腾讯镜像)
        run: sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|' android/gradle/wrapper/gradle-wrapper.properties

      # JDK 与本地工具链同代(Android Studio JBR = 21;Gradle 9.8 + AGP 9.4
      # 均要求 ≥ 17,取 21 对齐本地)。gradle 缓存含 wrapper 与依赖件。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # SDK:改用 runner 预装 cmdline-tools。android-actions/setup-android@v3
      # 内置的 `sdkmanager tools` 步骤因 Google 下架 legacy tools 包必挂
      # exit 1(2026-10 CI 实证),故弃用该 action;许可先全量预接受(许可
      # 提示不再打断安装),再装组件——与本地实装同版本,Gradle 侧不再向
      # dl.google.com 拉取。镜像口径只对本机有效,CI 直连官方源。
      # 注:API 37 平台包在官方仓库是 minor 版本包名(android-37.0/37.1/37.2),
      # 无裸 android-37——取与本地实装一致的 37.0(compileSdk=37 由 AGP 解析)。
      - name: Android SDK 许可预接受 + 组件安装
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" > /dev/null

      # mtdss-daemon 依赖 mtdss-proto(build script 需 protoc),沿 test job
      # 同款安装面;rust target 沿 T1 锁定的 aarch64-linux-android。
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-ndk --version 4.1.2 --locked

      # 引擎交叉编译:与本地/android Gradle 任务同一条锁定命令(T1 裁定,
      # -P 29 大写不可省——缺省 API 21 的目标缺 getifaddrs,链接失败)。
      - run: cargo ndk -t arm64-v8a -P 29 -- build -p mtdss-daemon --release

      # JVM 单测(契约 golden + 各 VM/逻辑面)→ debug APK 组装。assembleDebug
      # 的 preBuild 会再跑一次上面的锁定命令(纯增量,近零成本)并把产物拷
      # 入 jniLibs;更新源注入缺省空 = fail-closed(构建不依赖任何 secrets)。
      - run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
        working-directory: android

  # iOS 客户端(v2-P5 T12):aarch64 引擎静态库交叉编译 + MTDSSKit Swift
  # 单测(契约 golden 经 #filePath 锚仓库根直读 crates/ipc/contract,CI 检出
  # 布局与本地同构,无需拷贝/符号链接)。app 工程构建(xcodegen + 签名装载)
  # 不进 CI——Mac mini 构建盒 + docs/smoke-p5.md 真机冒烟兜底(同 android
  # 「模拟器不进 CI」评审口径)。macOS runner 海外直连 GitHub,无安卓 job
  # 的镜像切换问题。
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Xcode/Swift 用 runner 预装(macOS 镜像自带,零安装面)。macos-26
      # 钉死理由:Package.swift swift-tools-version 6.2(iOS 26 平台声明)
      # 需 Xcode 26.x 工具链——macos-15 镜像的 Xcode 16 只到 Swift 6.1,
      # 解析 6.2 manifest 即拒。此步顺带留痕实际 Xcode 版本。
      - run: xcodebuild -version

      # 引擎静态库交叉编译目标(真机 slice,与 ios/build.sh device 档同一条
      # 锁定命令;模拟器 slice aarch64-apple-ios-sim 只服务 app 构建,不进 CI)。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # mtdss-daemon → mtdss-proto(build script 需 protoc),沿 test/android
      # job 同款安装面。
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }

      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p ios-bridge --target aarch64-apple-ios --release

      - run: swift test
        working-directory: ios/package
