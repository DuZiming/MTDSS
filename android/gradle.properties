org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# compileSdk 37 超出当前 AGP 已测上限时静音「建议升级 AGP」警告(仅警告,
# 行为不变;AGP 追上后可移除)。
android.suppressUnsupportedCompileSdk=37

# ── 更新源注入(T12;spec §6,镜像 M4 构建期注入口径)──────────────────────────
# 两项缺省空 = 应用内「检查更新」呈「未配置更新源」(fail-closed),空值即
# 本仓的提交形态。本地/CI 覆盖:命令行 -P(优先)或 ~/.gradle/gradle.properties。
#   MTDSS_DL_BASE      更新分发基址(与服务器侧 vars.MTDSS_DL_BASE 同源,如
#                      https://<域名或IP>/dl;域名备案前不硬编码入仓)
#   MTDSS_UPDATE_PUBKEY 验签公钥 hex(keys/update-pub.hex 同一枚,全平台清单
#                      共用同一 ed25519 信任链)
# ── release 签名注入(T12;四项齐备才启用 release 签名,绝不入仓)──────────────
#   MTDSS_RELEASE_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD
#   生成/保管见 scripts/android/README.md「release 签名」。
MTDSS_DL_BASE=
MTDSS_UPDATE_PUBKEY=
