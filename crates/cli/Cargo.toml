[package]
name = "mtdss-cli"
edition.workspace = true
version.workspace = true

[lib]
name = "mtdss_cli"
path = "src/lib.rs"

[[bin]]
name = "mtdss"
path = "src/main.rs"

# CLI 是纯 IPC 客户端:传输/编排全在 daemon,这里只留 IPC 与命令面骨架。
[dependencies]
mtdss-ipc = { path = "../ipc" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# login --qr 的终端 ASCII 二维码(V3-1 Task 11):只要 unicode 半块渲染,
# image/svg 渲染器(feature 默认)用不上,裁掉免拖重依赖
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
# 进程内起 daemon + 真实 DaemonClient 的命令层联测
mtdss-daemon = { path = "../daemon" }
# 登录链路测试的 dev 模式验证码回显服务器(rusqlite bundled 需 C 工具链,
# 仅作 dev-dep,不影响库本体的 linux 交叉检查口径)
signaling = { path = "../../server/signaling" }
