[package]
name = "mtdss-cli"
edition.workspace = true
version.workspace = true

[lib]
name = "mtdss_cli"
path = "src/lib.rs"

[[bin]]
name = "mtdss"
path = "src/main.rs"

[dependencies]
mtdss-core = { path = "../core" }
mtdss-proto = { path = "../../proto" }
# 临时:session 迁入 daemon 后经 shim 保住 mtdss_cli::session 路径(Task 8 撤)
mtdss-daemon = { path = "../daemon" }
mtdss-ipc = { path = "../ipc" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
quinn.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
signaling = { path = "../../server/signaling" }
stun-server = { path = "../../server/stun" }
