[package]
name = "mtdss-core"
edition.workspace = true
version.workspace = true

[dependencies]
mtdss-proto = { path = "../../proto" }
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
ed25519-dalek.workspace = true
crypto_box.workspace = true
curve25519-dalek.workspace = true
prost.workspace = true
tokio-tungstenite.workspace = true
rustls-pemfile.workspace = true
if-addrs.workspace = true
x509-parser.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rand.workspace = true
hex.workspace = true
tracing.workspace = true
futures-util.workspace = true
time.workspace = true
fs2 = "0.4"
# trash(M3c 回收删除):android 目标剔除——trash crate 无 android 平台实现
# (交叉编译 E0433),android 亦无回收设施,delete_paths 在 android 下恒
# 永久删(见 fs.rs),依赖不进 android 依赖图。
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2"

[dev-dependencies]
tempfile = "3"
signaling = { path = "../../server/signaling" }
stun-server = { path = "../../server/stun" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
