[package]
name = "mtdss-daemon"
edition.workspace = true
version.workspace = true

[lib]
name = "mtdss_daemon"
path = "src/lib.rs"

[[bin]]
name = "mtdssd"
path = "src/main.rs"

[features]
# 桌面 HEIC→JPEG 预览转码(V4-1 T6,仅 Windows 代码面):默认关。
# 实现走 libheif 的**运行时动态加载**(LoadLibrary,见 preview/heic.rs 模块
# 注),无链接期 C 依赖——开关只管编译进多少代码,仓库构建零外部依赖。
# Windows CI/打包波开启(`cargo build/test -p mtdss-daemon --features heic`
# ),部署面要求 libheif.dll(+libde265.dll)随包分发;LGPL 合规注记见
# README「HEIC 预览转码(libheif)分发注记」节。
# (jpeg-encoder 自 V4-1 T7 起为 Windows 无条件依赖——缩略图后端
# thumb_win 的编码面,不随本特性门;本特性只门 heic 模块编译。)
heic = []

[dependencies]
# 工作区内 crate:path 直连(同 cli 对 mtdss-core 的写法)
mtdss-core = { path = "../core" }   # 身份(identity.seed):login.verify 生成/加载本机身份
mtdss-proto = { path = "../../proto" }
mtdss-ipc = { path = "../ipc" }
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gethostname.workspace = true
# session.rs 迁移所需
ed25519-dalek.workspace = true
hex.workspace = true
# 登录链路 REST(与 cli 同款特性集;rustls→ring 交叉检查由 CI Linux job 承担)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# flow.rs(Task 5 自 cli 整体搬入)按实际所需恢复:QUIC 端点/打洞 + 会话 id 随机数
quinn.workspace = true
rand.workspace = true
# jobs.rs 驱动监督(M4a-2):FutureExt::catch_unwind 包驱动任务
futures-util.workspace = true
# 更新核心(M4b Task 11):下载资产的 SHA-256 复核
sha2.workspace = true
# main 启动序 install_default(ring):进程级 rustls 默认 provider 兜底
# (信令 wss 公共 CA 路径已在 core 显式 ring,此处兜任何残余惰性 builder)
rustls.workspace = true
# 预览回环 HTTP 服务(V4-1 T4):127.0.0.1 数据面(axum/tokio 既有栈;
# ws feature 沿 workspace 定义,在线循环测试自建服务器同依赖)
axum.workspace = true

# Windows 专属:系统托盘(Task 9)与开机自启注册表。cfg(windows) 门控,
# Linux/macOS 构建不进入依赖图(cargo tree --target 可验证)。
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
winreg.workspace = true
# 缩略图编码(V4-1 T7,thumb_win 后端;heic 转码面同用):纯 Rust JPEG
# 编码,零 C 依赖。原为 heic 特性可选依赖,T7 起升 Windows 无条件
# (缩略图面不随特性门)。
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
# Shell 缩略图后端(V4-1 T7):IShellItemImageFactory COM 类型化绑定。
# 经 notify-rust→tauri-winrt-notification 链已在 Windows 构建树内
# (Cargo.lock 同版 0.62),此处显式直依 + 特性增配,零新增下载。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
# 托盘图标资产解码(V3-2):双弧 S 单色 PNG(brand/exported 四态)
png.workspace = true
# 文档目录解析(V3-2):收件箱默认落点 文档\MTDSS
dirs.workspace = true
# 托盘线程的 win32 消息泵(与 tray-icon 内部实现同源,版本对齐其依赖)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # HEIC 转码面(V4-1 T6):libheif.dll 运行时动态加载
    # (LoadLibraryW/GetProcAddress;仅 heic feature 代码消费,常开零负担)
    "Win32_System_LibraryLoader",
] }

# 托盘/自启测试直读 HKCU Run 键(集成测试是独立 crate,须自带 dev-dep)
[target.'cfg(windows)'.dev-dependencies]
winreg.workspace = true

# 接收完成系统通知(Task 5):headless/无总线失败仅 warn(notify.rs)。
# android/ios 剔除(设计 §4.1 桌面专属模块 cfg 门;P5 iOS 门禁收敛):
# notify-rust 的 unix 后端走 DBus 桌面总线,mobile 无总线,通知面由
# event.notify 帧承担(Kotlin/Swift UI 消费同一文案),依赖不进
# android/ios 依赖图。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "4"

# 缩略图后端(field r22 #1 Linux/macOS→r25 扩移动端:PC 浏览手机/手机
# 自览 inbox 文件时 /thumb 恒空字节=缩略图全无的根因,模拟器实锤;照片
# vpath 走 0x0B 桥不受影响)。image 纯 Rust 解码+缩放(jpeg/png/gif/
# bmp/webp);Windows 依赖图零增(Shell COM 不动)。notify-rust 不能并
# 入本节(mobile 剔除),故 image 单列全平台非 Windows 节。
[target.'cfg(not(windows))'.dependencies]
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "webp",
] }

# Android(P3,设计 §4.1 裁定⑥):main.rs 启动序 prctl(PR_SET_PDEATHSIG)
# 保「App 亡引擎即亡」——android 应用进程被杀时子进程不会自动连带死
# (reparent 到 init),引擎侧 cfg 门内小改兜住异常杀路径。
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# HEIC 夹具的 JPEG 校验面(V4-1 T6;brief 钉 image crate 校验尺寸):
# 仅 jpeg 编解码特性,免默认全家桶。dev-dep 不可选(feature 语法限制),
# 默认测试构建的恒定小开销(cargo 2026-11 实证:optional dev-dep 拒载)。
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# mux serve 回环测试:手编 ctrl 请求帧/手读响应帧的 prost 编解码(系
# mtdss-proto 的既有传递依赖,零新增编译单元)
prost.workspace = true
# 登录链路测试:dev 模式验证码回显的真实信令服务器(rusqlite bundled 需 C
# 工具链,仅作 dev-dep,不影响库本体的 linux 交叉检查口径)
signaling = { path = "../../server/signaling" }
# flow.rs 库内单测(single_stun_addr_uses_alt_primary)所需:回环真 STUN
stun-server = { path = "../../server/stun" }
# 在线循环测试:固定端口自建服务器(build_router 的 Router 由 hyper 直驱,
# 连接任务句柄归测试所有,kill 可模拟进程死亡);均为既有传递依赖
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
# 同端口重启:SO_REUSEADDR 绕过 TIME_WAIT 残留(Windows 占端口语义)
socket2 = "0.6"
# 契约 golden 测试(contract_golden):裸 NDJSON 客户端逐字节收发线上帧
# (与 mtdss-ipc 同版本同特性,系既有传递依赖,零新增编译单元)
interprocess.workspace = true
# 转码段等待窗测试面(V4-1 T15):tokio 暂停钟(`#[tokio::test(start_paused
# = true)]`)即注入时钟——拨钟即烧窗,零真实等待(10s 界全值真测;仅测试
# 构建,生产 tokio features 不变)。
tokio = { workspace = true, features = ["test-util"] }
