[workspace]
resolver = "2"
members = ["crates/core", "crates/ipc", "crates/daemon", "crates/cli", "proto", "server/signaling", "server/stun"]
# UI 壳是独立 Tauri crate(有自己的 [workspace]),不并入主 workspace
exclude = ["ui/src-tauri"]

[workspace.package]
edition = "2021"
version = "1.0.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", features = ["rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = { version = "0.13" }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
crypto_box = { version = "0.8", features = ["std", "seal"] }
curve25519-dalek = "4"
prost = "0.13"
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
if-addrs = "0.13"
x509-parser = "0.16"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures-util = "0.3"
time = { version = "0.3", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2"
interprocess = { version = "2", features = ["tokio"] }
gethostname = "0.5"
tray-icon = "0.20"
winreg = "0.55"
