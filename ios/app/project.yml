# MTDSS iOS 工程生成(v2-P5 T4;xcodegen generate 产 MTDSS.xcodeproj,不入库)。
# 目标:MTDSS 主 App(链 MTDSSKit + libios_bridge.a 静态库)+ MTDSSShare 占位壳
# (T12 实装,spec §4.7/§5.4)。构建走 ios/build.sh(cargo → 拷 .a → 本文件 →
# xcodebuild),bundle id 定死 top.mtdss.ios(spec §5.5)。
name: MTDSS
options:
  bundleIdPrefix: top.mtdss
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MTDSSKit:
    path: ../package
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    # 版本(T13):marketing=workspace 版本 1.1.0;build 号由 build.sh device-sign
    # 命令行注入(缺省日期制 YYYYMMDD.1,单调递增;此处 1 仅 sim 档占位)。
    # Info.plist 两侧以 "$(MARKETING_VERSION)"/"$(CURRENT_PROJECT_VERSION)"
    # 引用(xcodebuild 处理 Info.plist 时展开,标准做法)。
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 自动签名(T13):Apple ID 会话 + -allowProvisioningUpdates 自动注册
    # 双 App ID(top.mtdss.ios / top.mtdss.ios.share)与 App Group
    CODE_SIGN_STYLE: Automatic
targets:
  MTDSS:
    type: application
    platform: iOS
    sources:
      - MTDSS
    dependencies:
      - package: MTDSSKit
      # 引擎静态库(T2 产物;build.sh 先拷入 Engine/ 再生成/构建)
      - framework: Engine/libios_bridge.a
        embed: false
      # 分享扩展占位壳(T12 实装)
      - target: MTDSSShare
    info:
      path: MTDSS/Info.plist
      properties:
        CFBundleDisplayName: MTDSS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # 本地网络权限(spec §5.6 逐字;缺失时 iOS 14+ 静默断连不弹窗)
        NSLocalNetworkUsageDescription: "MTDSS 需要在本地网络中查找并连接你的其他设备,以实现高速直连传输。"
        # 收件箱 = App Documents(spec §5.2:文件 App「我的 iPhone/MTDSS」可见)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 出口合规(T13):标准加密豁免(仅 HTTPS/TLS 标准加密)——TestFlight
        # 外部组提审与 App Store 都免手答
        ITSAppUsesNonExemptEncryption: false
        # 分享扩展拉起 URL(T11:mtdss://share-consumed;open() 受限时的
        # 降级路径 = 用户手动打开,注册 scheme 供 open() 成功路径使用)
        CFBundleURLTypes:
          - CFBundleURLName: top.mtdss.ios.share
            CFBundleURLSchemes: [mtdss]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.mtdss.ios
        # App Group(spec §5.4:group.top.mtdss.shared)——分享队列 + 设备
        # 缓存共享容器;扩展同组(MTDSSShare.entitlements)
        CODE_SIGN_ENTITLEMENTS: MTDSS/MTDSS.entitlements
        # 占位 App 图标(v2p5-t10b):Assets.xcassets/AppIcon.appiconset 单尺寸
        # 1024 universal;xcodegen 自动把 sources 目录下的 .xcassets 计入资源
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 静态库链接检索路径(-lios_bridge 需 -L;xcodegen 的 framework 条目
        # 只落 -F 框架检索,对 .a 无效)
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Engine"
  MTDSSShare:
    type: app-extension
    platform: iOS
    sources:
      - MTDSSShare
    dependencies:
      # Kit 纯 Foundation 面(ShareQueueStore/SharedDeviceCache/契约模型);
      # 引擎静态库不进扩展(spec §5.4 内存限额 + 秒级寿命)
      - package: MTDSSKit
    info:
      path: MTDSSShare/Info.plist
      properties:
        CFBundleDisplayName: MTDSS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 扩展自身无网络;文案带上无害且满足 T11 简报要求(真机排障时
        # 不缺面)
        NSLocalNetworkUsageDescription: "MTDSS 需要在本地网络中查找并连接你的其他设备,以实现高速直连传输。"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # 激活规则(T11,spec §4.7:文件/图片,拒不擅长的形态):
              # 声明文件/图片/影片三类文件型附件(单类至多 20 项);文本
              # 纯串、网页链接等无文件表示的分享不亮 MTDSS(装载面收不了)。
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.mtdss.ios.share
        CODE_SIGN_ENTITLEMENTS: MTDSSShare/MTDSSShare.entitlements
schemes:
  MTDSS:
    build:
      targets:
        MTDSS: all
    run:
      config: Debug
    archive:
      # 归档走 Release(T13 device-sign 档;引擎静态库本就 --release 出)
      config: Release
