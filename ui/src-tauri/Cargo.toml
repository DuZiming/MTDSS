[package]
name = "ui"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 单实例:第二实例启动即退出,回调唤起既有主窗(show + set_focus);
# 官方要求本插件先于其他插件注册
tauri-plugin-single-instance = "2"
# 系统目录选择器(Task 12「下载到本机…」):Rust 侧经 DialogExt 包装为
# pick_folder 命令,前端不直接依赖插件的 JS 面
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# daemon IPC 桥:本地 JSON-RPC 客户端 + daemon 可执行文件发现
mtdss-ipc = { path = "../../crates/ipc" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
anyhow = "1"
tracing = "0.1"

# 拖出落点解析(dropresolve)与剪贴板直读(clipboard_files)/文本写入
# (copy_text):Win32 光标/窗口类 + UIA 地址栏读取 + 已知文件夹 +
# CF_HDROP/CF_UNICODETEXT。仅 Windows 需要;特性按实际用到的 API 收口
# (无 System_Ole 的 COM 面:CF_HDROP/CF_UNICODETEXT 常量在 Ole;剪贴板
# 开关在 DataExchange;SysFreeString 在 Foundation,且 BSTR 生命周期全部由
# VariantClear 托管;全局内存分配/锁定在 Memory)。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 独立 crate:不并入上级 workspace(根 Cargo.toml 同时 exclude 了本目录),
# 空表显式声明,防止任何上层把这里当作 workspace 成员。
[workspace]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
